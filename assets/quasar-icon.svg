<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title">
  <title id="title">Quasar</title>
  <defs>
    <!-- Clears the rings where the disk passes in front of them -->
    <mask id="disk-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect width="256" height="256" fill="#FFFFFF"/>
      <path transform="translate(120.5 142.5) rotate(30)" d="M -108 0 C -75.6 -6.6, -43.2 -11, 0 -11 C 43.2 -11, 75.6 -6.6, 108 0 C 75.6 6.6, 43.2 11, 0 11 C -43.2 11, -75.6 6.6, -108 0 Z" fill="#000000" stroke="#000000" stroke-width="24" stroke-linejoin="round"/>
    </mask>
    <!-- Everything on the far side of the disk -->
    <clipPath id="behind-disk">
      <rect transform="translate(120.5 142.5) rotate(30)" x="-300" y="-300" width="600" height="300"/>
    </clipPath>
  </defs>
  <!-- Tile -->
  <rect width="256" height="256" rx="56" fill="#000000"/>
  <!-- Event horizon -->
  <circle stroke="#FFFFFF" cx="130" cy="126" r="60" fill="none" stroke-width="19" mask="url(#disk-gap)"/>
  <!-- Photon ring, hugging the shadow, seen only behind the disk -->
  <g clip-path="url(#behind-disk)">
    <circle stroke="#FFFFFF" cx="130" cy="126" r="39" fill="none" stroke-width="5" mask="url(#disk-gap)"/>
  </g>
  <!-- Accretion disk, edge-on and thinning outwards: the tail of the Q -->
  <path fill="#FFFFFF" transform="translate(120.5 142.5) rotate(30)" d="M -108 0 C -75.6 -6.6, -43.2 -11, 0 -11 C 43.2 -11, 75.6 -6.6, 108 0 C 75.6 6.6, 43.2 11, 0 11 C -43.2 11, -75.6 6.6, -108 0 Z"/>
</svg>
